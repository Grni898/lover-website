<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVER DRINKS – PREMIUM</title>

<style>
body {
  margin: 0;
  background: linear-gradient(180deg, #000, #0a0010, #000);
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Logo */
.logo {
  text-align: center;
  margin-top: 40px;
  font-size: 80px;
  font-weight: 900;
  color: #ff4df0;
  text-shadow: 0 0 25px #ff4df0, 0 0 60px #ff4df0;
  animation: glow 3s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 20px #ff4df0; }
  to { text-shadow: 0 0 60px #ff4df0; }
}

/* Flavor Buttons */
.flavors {
  display: flex;
  justify-content: center;
  margin-top: 50px;
  gap: 30px;
}

.flavor-btn {
  padding: 20px 45px;
  border-radius: 16px;
  border: none;
  font-size: 26px;
  cursor: pointer;
  color: white;
  background: #1a1a1a;
  transition: 0.25s;
  box-shadow: 0 0 15px #ff4df0;
}

.flavor-btn:hover {
  transform: scale(1.15);
  box-shadow: 0 0 30px #ff4df0;
}

/* Bottle */
.bottle {
  width: 420px;
  margin: 80px auto;
  display: block;
  filter: drop-shadow(0 0 40px #ff4df0);
  transition: 0.3s;
}

/* Flavor Info Box */
#flavor-info {
  width: 90%;
  max-width: 800px;
  margin: 40px auto;
  padding: 30px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 25px;
  text-align: center;
  font-size: 24px;
  line-height: 1.6;
  display: none;
  box-shadow: 0 0 25px #ff4df0;
  animation: fadeIn 0.5s ease-in-out;
}
</style>
</head>

<body>

<div class="logo">LOVER DRINKS</div>

<div class="flavors">
  <button class="flavor-btn" onclick="changeFlavor('peach')">🍑 Peach Lover</button>
  <button class="flavor-btn" onclick="changeFlavor('blue')">💙 Blueberry Lover</button>
  <button class="flavor-btn" onclick="changeFlavor('coco')">🥥 Coco Lover</button>
</div>

<img id="bottle" class="bottle" src="https://via.placeholder.com/420x900/ff4df0/ffffff?text=LOVER" />

<div id="flavor-info"></div>

<script>
let sound = new Audio();
sound.volume = 0.4;

function changeFlavor(type) {
  const bottle = document.getElementById("bottle");
  const info = document.getElementById("flavor-info");

  if (type === "peach") {
    bottle.src = "https://via.placeholder.com/420x900/faa/fff?text=PEACH+LOVER";
    info.innerHTML = "<h2>🍑 Peach Lover</h2>Fruchtiger Pfirsich‑Kick mit Premium‑Glow und smoothen Vibes.";
  }

  if (type === "blue") {
    bottle.src = "https://via.placeholder.com/420x900/55f/fff?text=BLUEBERRY+LOVER";
    info.innerHTML = "<h2>💙 Blueberry Lover</h2>Frische Blaubeere mit neonblauem Aroma und Galaxy‑Feeling.";
  }

  if (type === "coco") {
    bottle.src = "https://via.placeholder.com/420x900/fff/000?text=COCO+LOVER";
    info.innerHTML = "<h2>🥥 Coco Lover</h2>Cremiger Kokos‑Geschmack mit tropischem Premium‑Feeling.";
  }

  info.style.display = "block";
  sound.src = "https://cdn.pixabay.com/download/audio/2022/03/15/audio_7b3e6f.mp3?filename=pop-110271.mp3";
  sound.play();
}
</script>

</body>
</html>
